jigglypuffkirbyshared-spawneffect:
  path: 'src/jigglypuffkirbyshared.asm'
  line: [
    "addiu   at, r0, Character.id.PICHU      // PICHU ID",
    "beq     v0, at, _pokeballflash          // modified original line 1 part 1"
  ]
  prefix: "\t\t"
  suffix: "\n\t\t"
  type: AfterFirst
  where: 'beq     v0, at, _pokeballflash          // modified original line 1 part 1'


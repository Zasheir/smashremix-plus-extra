pikashared-thestructs:
  path: 'src/pikashared.asm'
  line: [
    "// PICHU",
    "",
    "OS.align(16)            //this little block was written by pringles_ssb ty pringles_ssb",
    "thunder_anim_struct_pichu:",
    "dw  0x020F0000",
    "dw  Character.PICHU_file_4_ptr",
    "dw  0x1C000000 ",
    "dw  0x00000000",
    "dw  0x80101A08",
    "dw  0x80101AA8",
    "dw  0x00009D20",
    "dw  0x00009DD8",
    "dw  0x00000000",
    "",
    "OS.align(16)",
    "thunder_special_struct_1_pichu:",
    "dw 0x02000000",
    "dw 0x0000000B",
    "dw Character.PICHU_file_1_ptr",
    "OS.copy_segment(0x103B6C, 0x40)",
    "",
    "OS.align(16)",
    "thunder_special_struct_2_pichu:",
    "dw 0x02000000",
    "dw 0x0000000C",
    "dw Character.PICHU_file_1_ptr",
    "OS.copy_segment(0x103BA0, 0x40)",
    ""
  ]
  prefix: "\t"
  suffix: "\n\t"
  type: BeforeFirst
  where: '// Pikachu shares hardcodings with Jigglypuff and some of his hardcodings are in jigglypuffkirbyshared.asm'
pikashared-get-thunder-anim-struct:
  path: 'src/pikashared.asm'
  line: [
    "beq     t1, t2, _end                // end if character id = PICHU",
    "ori     t2, r0, Character.id.PICHU  // t2 = id.PICHU",
    "li      a0, thunder_anim_struct_pichu     // a0 = thunder_struct"
  ]
  prefix: "\t\t"
  suffix: "\n\t\t"
  type: AfterFirst
  where: 'li      a0, thunder_anim_struct_jpika     // a0 = thunder_struct_jpika'

pikashared-get-thunder-special-struct1:
  path: 'src/pikashared.asm'
  line: [
    "beq     t1, t2, _end                // end if character id = PICHU",
    "ori     t2, r0, Character.id.PICHU  // t2 = id.PICHU",
    "li      a1, thunder_special_struct_1_pichu     // a1 = thunder_special_struct_1_pichu"
  ]
  prefix: "\t\t"
  suffix: "\n\t\t"
  type: AfterFirst
  where: 'li      a1, thunder_special_struct_1_jpika     // a0 = thunder_struct_jpika'


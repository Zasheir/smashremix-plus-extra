  path: 'src/pikashared.asm'
  line: [
    "Character.table_patch_start(recovery_logic, Character.id.PICHU, 0x4)",
    "dw recovery_logic; OS.patch_end()"
  ]
  prefix: "\t"
  suffix: "\n\t"
  type: AfterFirst
  where: 'dw recovery_logic; OS.patch_end()'

